name: Bug Report
description: Something isn't working as expected
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I tap 'Add to library', nothing happens and the button stays disabled."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reliably reproduce the issue?
      placeholder: |
        1. Go to Search
        2. Search for "Mario"
        3. Tap a game
        4. Tap "Add to library"
        5. See error / nothing happens
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: How are you running TGP?
      options:
        - Docker (docker compose up)
        - Development mode (npm run dev:all)
        - Docker — pulled from ghcr.io
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / device
      placeholder: "Chrome 124 on Android 14 / Safari on iPhone 15"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or console errors
      description: Paste any browser console errors or `docker compose logs` output.
      render: shell
